sv_hibernate_when_empty              1

// UNEXPECTED LONG FRAME DETECTED fix
// https://github.com/ValveSoftware/csgo-osx-linux/issues/3681
sv_clockcorrection_msecs             15

// Relay only: share no ICE candidates (public, IPv6, Tailscale or pod addresses)
// with players, so every connection goes through Steam Datagram Relay and the
// node's real IP is never handed out. Applies to connections created after it
// runs; server.cfg runs at map load, before players can join. Rollback: -1.
net_option P2P_Transport_ICE_Enable 0

engine_show_frame_pacing             0
engine_frametime_warnings_enable     0

tv_enable                            0

sv_allow_votes                       1

mapgroup                             mg_public