name: Tests

on:
  pull_request:
  push:
    branches:
      - "main"
      - "beta"

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test crash reports
        run: bash shared/scripts/test/crash-report.test.sh

      - name: Test documented crash-report limitations
        run: python3 shared/scripts/test/crash-report-limitations.test.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [counterstrikesharp, swiftly, utility-sw]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test apps/${{ matrix.plugin }}/test/FiveStack.Tests.csproj -c Release
